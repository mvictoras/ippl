-
  action: "add_pipelines"
  pipelines:
    pl1:
      f1:
        type: "threshold"
        params:
          field: "particle_magnitude"
          min_value: 9.2
          max_value: 25.0
-
  action: "add_extracts"
    extracts:
      e1:
        type: "python"
        pipeline: "pl1"
        params:
          file: "ascent/ascent_trame_bridge.py"
